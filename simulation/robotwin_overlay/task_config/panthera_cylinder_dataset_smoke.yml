render_freq: 0
episode_num: 4
use_seed: false
# RoboTwin advances physics at 250 Hz.  Capturing every fifth step records the
# commanded trajectory at 50 Hz without wall-clock sleeps.
save_freq: 5
embodiment: [panthera, panthera, 0.6]
language_num: 7
planner_backend: mplib
static_friction: 1.2
dynamic_friction: 1.0
restitution: 0
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: false
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: /data/lyy/panthera-vla/data
clear_cache_freq: 1
collect_data: true
eval_video_log: false
