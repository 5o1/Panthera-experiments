render_freq: 0
episode_num: 1
use_seed: false
save_freq: 5
embodiment: [panthera]
language_num: 1
planner_backend: mplib
static_friction: 1.2
dynamic_friction: 1.0
restitution: 0
# Local +X approaches downward; Panthera's local +Y finger axis closes across
# the horizontal cylinder diameter in world Y.
grasp_quaternion_wxyz: [0.7071067811865476, 0.0, 0.7071067811865476, 0.0]
task_randomization:
  cylinder_y_base_m: -0.06
  cylinder_x_m: 0.0
  cylinder_y_m: 0.0
  groove_x_m: 0.0
  groove_y_m: 0.0
domain_randomization:
  random_background: false
  cluttered_table: false
  clean_background_rate: 1
  random_head_camera_dis: 0
  random_table_height: 0
  random_light: false
  crazy_random_light_rate: 0
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: false
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ../data
clear_cache_freq: 1
collect_data: true
eval_video_log: false
