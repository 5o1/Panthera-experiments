# Panthera real-hardware experiment overlay. Never use with arm_control_node.
controller_manager:
  ros__parameters:
    # Match the mature Host application's main non-blocking hardware loop.
    update_rate: 200
    use_sim_time: false
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_velocity_limit_controller:
      type: forward_command_controller/ForwardCommandController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: false

arm_controller:
  ros__parameters:
    use_sim_time: false
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      joint1: {trajectory: 0.10, goal: 0.03}
      joint2: {trajectory: 0.10, goal: 0.03}
      joint3: {trajectory: 0.10, goal: 0.03}
      joint4: {trajectory: 0.10, goal: 0.03}
      joint5: {trajectory: 0.10, goal: 0.03}
      joint6: {trajectory: 0.10, goal: 0.03}

# Panthera's SDK interprets this velocity interface as a positive maximum
# speed for posVelMaxTorque, not as signed joint velocity.  Keep ownership
# separate from the position trajectory controller.
arm_velocity_limit_controller:
  ros__parameters:
    joints: [joint1, joint2, joint3, joint4, joint5, joint6]
    interface_name: velocity
