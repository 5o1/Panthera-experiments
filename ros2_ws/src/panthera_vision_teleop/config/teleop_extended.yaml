# 最终大范围候选，仅用于 camera/synthetic dry-run；robot 模式明确拒绝。
teleop_mapper_node:
  ros__parameters:
    position_gain: [0.0, 0.50, 0.30]
    max_position_offset: [0.0, 0.12, 0.10]
    position_deadband_m: [0.0, 0.002, 0.002]
    max_position_velocity_mps: [0.02, 0.07, 0.06]
    max_position_acceleration_mps2: [0.08, 0.22, 0.18]
    enable_orientation: false
    publish_gripper_commands: false
