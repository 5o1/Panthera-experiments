defaults:
  - env/robotwin_place_randomized_cylinder_in_socket@env.eval
  - model/openvla_oft@rollout.model
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env, rollout: 0-2

runner:
  task_type: embodied_eval
  logger:
    log_path: ../results
    project_name: panthera
    experiment_name: panthera_v2_schema10_openvlaoft
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 6
    total_num_envs: 3
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 1600
    max_steps_per_rollout_epoch: 1600
    group_size: 1
    use_fixed_reset_state_ids: false
    assets_path: /data/lyy/panthera-vla/runtime/robotwin
    seeds_path: ${oc.env:PANTHERA_PHONE_EVAL_SEEDS}
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    enable_offload: false

rollout:
  sampling_params:
    do_sample: true
    temperature_train: 1.6
    temperature_eval: -1
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: /data/lyy/panthera-vla/models/openvla-oft-place-empty-cup
    model_type: openvla_oft
    implement_version: official
    value_type: action_level
    action_dim: 7
    use_proprio: true
    proprio_dim: 7
    use_film: false
    num_action_chunks: 25
    unnorm_key: panthera_phone_cylinder_socket_v2
    center_crop: true
    add_value_head: true
    is_lora: true
    use_l1_regression: true
    max_prompt_length: 512
