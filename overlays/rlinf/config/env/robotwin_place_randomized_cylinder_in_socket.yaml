env_type: robotwin
total_num_envs: null
auto_reset: false
ignore_terminations: false
reward_coef: 1.0
use_custom_reward: true
use_rel_reward: true
center_crop: true
seed: 0
group_size: 1
use_fixed_reset_state_ids: false
# Budget counts 50 Hz actions, not physics steps.  Measured on the fixedcam 1280
# expert set: upright needs at most 1283, lying has median 2211 and max 5101, so
# 3200 leaves 96.2% of lying episodes completable.  The previous 1600 left 4.8%.
max_steps_per_rollout_epoch: 3200
max_episode_steps: 3200
is_eval: true
assets_path: /data/lyy/panthera-vla/runtime/robotwin
seeds_path: ${oc.env:PANTHERA_PHONE_EVAL_SEEDS}
video_cfg:
  save_video: true
  info_on_video: true
  video_base_dir: ${runner.logger.log_path}/video/eval
enable_offload: false
task_config:
  task_name: place_randomized_cylinder_in_socket
  action_dim: 7
  step_lim: 3200
  planner_backend: mplib
  render_freq: 0
  episode_num: 18
  use_seed: false
  save_freq: 5
  embodiment: [panthera_phone_symmetric]
  language_num: 7
  static_friction: 1.2
  dynamic_friction: 1.0
  gripper_static_friction: 8.0
  gripper_dynamic_friction: 6.0
  restitution: 0
  task_randomization:
    # The SFT dataset was collected through one fixed camera pose, so an eval
    # that leaves this out falls back to pose_mode: randomized and scores the
    # policy on viewpoints it has never seen -- azimuth 25-155 deg and 0.55-1.1 m
    # of distance against the single 90 deg, 0.55 m pose it was trained on.
    # Measured on the 16h checkpoint, that shift drops the arm skill score from
    # 0.576 to 0.049, i.e. to no better than echoing proprio, which is what a
    # 0/18 eval looks like.  Values mirror the dataset's own
    # scene_info.json -> task_randomization.camera_randomization.
    camera_randomization:
      pose_mode: fixed
      fixed_azimuth_deg: 90.0
      fixed_height_above_table_m: 0.60
      fixed_horizontal_distance_m: 0.55
      fixed_look_at_xyz_m: [0.0013, -0.0929, 0.8851]
      image_width_px: 320
      image_height_px: 240
      vertical_fov_deg: 75.0
      central_region_fraction: 0.8
      minimum_height_above_table_m: 0.55
      maximum_height_above_table_m: 0.95
      minimum_horizontal_distance_m: 0.55
      maximum_horizontal_distance_m: 1.1
      minimum_azimuth_deg: 25.0
      maximum_azimuth_deg: 155.0
      minimum_downward_angle_deg: 28.0
      target_xy_jitter_m: 0.0
      target_height_min_m: 0.08
      target_height_max_m: 0.22
      maximum_sampling_attempts: 512
    workspace:
      robot_base_x_m: 0.0
      robot_base_y_m: -0.35
      nominal_reach_radius_m: 0.46
      reach_fraction: 0.75
      minimum_radius_m: 0.22
      minimum_angle_deg: 5.0
      maximum_angle_deg: 175.0
      radial_bins: 3
      angular_bins: 12
      minimum_object_separation_m: 0.16
  domain_randomization:
    random_background: true
    cluttered_table: false
    clean_background_rate: 0.20
    # The constrained extrinsic randomization above is the recorded one; this is
    # RoboTwin's separate, unrecorded isotropic jitter and collection disabled it.
    random_head_camera_dis: 0
    random_table_height: 0
    random_light: true
    crazy_random_light_rate: 0.02
  camera:
    head_camera_type: PhoneSRT_Center4_3_Wide
    wrist_camera_type: D435
    collect_head_camera: true
    collect_wrist_camera: false
  data_type:
    rgb: true
    third_view: false
    depth: false
    pointcloud: false
    observer: false
    endpose: true
    qpos: true
    mesh_segmentation: false
    actor_segmentation: false
  pcd_down_sample_num: 1024
  pcd_crop: true
  save_path: ./data
  clear_cache_freq: 4
  collect_data: false
  eval_video_log: false
