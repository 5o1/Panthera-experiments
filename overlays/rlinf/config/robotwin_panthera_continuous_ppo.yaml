defaults:
  - env/robotwin_place_randomized_cylinder_in_socket@env.train
  - env/robotwin_place_randomized_cylinder_in_socket@env.eval
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # The launch wrapper exposes physical GPUs 2 and 3 only.  RLinf therefore
    # sees them as logical GPUs 0 and 1 and shards every component across both.
    actor, env, rollout: 0-1

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:PANTHERA_RL_OUTPUT_DIR}
    project_name: panthera-openvla-rl
    experiment_name: ${oc.env:PANTHERA_RL_RUN_NAME}
    logger_backends: [tensorboard, wandb]
  max_epochs: ${oc.decode:${oc.env:PANTHERA_RL_MAX_EPOCHS,1}}
  max_steps: ${oc.decode:${oc.env:PANTHERA_RL_MAX_STEPS,1}}
  only_eval: ${oc.decode:${oc.env:PANTHERA_RL_EVAL_ONLY,false}}
  eval_frozen_sft_baseline: ${oc.decode:${oc.env:PANTHERA_RL_EVAL_FROZEN_SFT_BASELINE,false}}
  val_check_interval: ${oc.decode:${oc.env:PANTHERA_RL_VAL_CHECK_INTERVAL,-1}}
  save_interval: ${oc.decode:${oc.env:PANTHERA_RL_SAVE_INTERVAL,1}}
  resume_dir: null
  ckpt_path: ${oc.env:PANTHERA_RL_CHECKPOINT,null}

algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  bootstrap_type: standard
  kl_beta: 0.0
  entropy_bonus: 1.0e-4
  clip_ratio_high: 0.20
  clip_ratio_low: 0.20
  value_clip: 0.20
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  update_epoch: 1

env:
  group_name: EnvGroup
  train:
    rollout_epoch: ${oc.decode:${oc.env:PANTHERA_RL_ROLLOUT_EPOCHS,2}}
    total_num_envs: ${oc.decode:${oc.env:PANTHERA_RL_NUM_ENVS,2}}
    auto_reset: true
    ignore_terminations: false
    use_fixed_reset_state_ids: true
    # Panthera returns action-aligned R1/R2 rewards from the simulator.  The
    # upstream custom path replaces them with ``termination`` and would erase
    # potential shaping and hard-failure penalties.
    use_custom_reward: false
    use_rel_reward: false
    is_eval: false
    group_size: 1
    max_episode_steps: ${oc.decode:${oc.env:PANTHERA_RL_EPISODE_ACTIONS,25}}
    max_steps_per_rollout_epoch: ${oc.decode:${oc.env:PANTHERA_RL_EPOCH_ACTIONS,25}}
    assets_path: ${oc.env:PANTHERA_ROBOTWIN_RUNTIME}
    seeds_path: ${oc.env:PANTHERA_RL_RUNTIME}/seeds/panthera_rl_ep2_seed.json
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/train
    enable_offload: true
    task_config:
      step_lim: ${env.train.max_episode_steps}
      rl_reward_variant: ${oc.env:PANTHERA_RL_REWARD_VARIANT,r1}
      # The SFT checkpoint was trained on qpos/qvel/qacc/effort, in that
      # order.  Keep observation width selection explicit at the RoboTwin
      # boundary instead of silently falling back to the 7-D action vector.
      proprio_key: dynamics_vector
      proprio_dim: 28
      save_freq: 5
      collect_data: false
      eval_video_log: false
      task_randomization:
        scene_registry: /data/lyy/panthera-vla/ci/overfit-ep2-dynamics-24h/ddpfix-dynamics-28d-ep2-24h-20260922T173901Z/subset/scenes.json
        scene_registry_required: true
        rl_warm_start:
          enabled: ${oc.decode:${oc.env:PANTHERA_RL_WARM_START,false}}
          trajectory_path: ${oc.env:PANTHERA_RL_WARM_START_TRAJECTORY,/data/lyy/panthera-vla/ci/dynamics-ep2/dataset/data/episode2.hdf5}
          prefix_actions: ${oc.decode:${oc.env:PANTHERA_RL_WARM_START_ACTIONS,780}}
  eval:
    rollout_epoch: ${oc.decode:${oc.env:PANTHERA_RL_EVAL_ROLLOUT_EPOCHS,4}}
    total_num_envs: ${oc.decode:${oc.env:PANTHERA_RL_EVAL_NUM_ENVS,2}}
    auto_reset: true
    ignore_terminations: false
    use_fixed_reset_state_ids: true
    use_custom_reward: false
    use_rel_reward: false
    is_eval: true
    max_episode_steps: ${oc.decode:${oc.env:PANTHERA_RL_EVAL_EPISODE_ACTIONS,150}}
    max_steps_per_rollout_epoch: ${oc.decode:${oc.env:PANTHERA_RL_EVAL_EPOCH_ACTIONS,150}}
    assets_path: ${oc.env:PANTHERA_ROBOTWIN_RUNTIME}
    seeds_path: ${oc.env:PANTHERA_RL_RUNTIME}/seeds/panthera_rl_ep2_seed.json
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    enable_offload: true
    task_config:
      step_lim: ${env.eval.max_episode_steps}
      rl_reward_variant: ${oc.env:PANTHERA_RL_REWARD_VARIANT,r2}
      proprio_key: dynamics_vector
      proprio_dim: 28
      save_freq: 5
      collect_data: false
      eval_video_log: true
      task_randomization:
        scene_registry: /data/lyy/panthera-vla/ci/overfit-ep2-dynamics-24h/ddpfix-dynamics-28d-ep2-24h-20260922T173901Z/subset/scenes.json
        scene_registry_required: true
        rl_warm_start:
          enabled: ${oc.decode:${oc.env:PANTHERA_RL_WARM_START,true}}
          trajectory_path: ${oc.env:PANTHERA_RL_WARM_START_TRAJECTORY,/data/lyy/panthera-vla/ci/dynamics-ep2/dataset/data/episode2.hdf5}
          prefix_actions: ${oc.decode:${oc.env:PANTHERA_RL_WARM_START_ACTIONS,780}}

rollout:
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: -1
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  collect_prev_infos: true
  collect_final_values: true
  model:
    # Training workers read actor.model.  In checkpoint-only mode RLinf reads
    # rollout.model instead, so expose the complete continuous-policy contract
    # rather than only path/precision.
    model_type: openvla_oft
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
    implement_version: ${actor.model.implement_version}
    value_type: ${actor.model.value_type}
    action_dim: ${actor.model.action_dim}
    use_proprio: ${actor.model.use_proprio}
    proprio_dim: ${actor.model.proprio_dim}
    use_film: ${actor.model.use_film}
    num_action_chunks: ${actor.model.num_action_chunks}
    unnorm_key: ${actor.model.unnorm_key}
    center_crop: ${actor.model.center_crop}
    add_value_head: ${actor.model.add_value_head}
    is_lora: ${actor.model.is_lora}
    use_l1_regression: ${actor.model.use_l1_regression}
    max_prompt_length: ${actor.model.max_prompt_length}
    num_images_in_input: ${actor.model.num_images_in_input}
    continuous_rl: ${actor.model.continuous_rl}
    continuous_rl_variant: ${actor.model.continuous_rl_variant}
    execution_horizon: ${actor.model.execution_horizon}
    continuous_feature_dim: ${actor.model.continuous_feature_dim}
    continuous_history_dim: ${actor.model.continuous_history_dim}
    continuous_max_residual: ${actor.model.continuous_max_residual}
    continuous_initial_log_std: ${actor.model.continuous_initial_log_std}
    continuous_min_log_std: ${actor.model.continuous_min_log_std}
    continuous_max_log_std: ${actor.model.continuous_max_log_std}
    continuous_consistency_coef: ${actor.model.continuous_consistency_coef}
    continuous_history_noise_std: ${actor.model.continuous_history_noise_std}
    continuous_history_dropout_probability: ${actor.model.continuous_history_dropout_probability}

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: ${oc.decode:${oc.env:PANTHERA_RL_MICRO_BATCH,1}}
  global_batch_size: ${oc.decode:${oc.env:PANTHERA_RL_GLOBAL_BATCH,20}}
  seed: ${oc.decode:${oc.env:PANTHERA_RL_SEED,1234}}
  enable_offload: true
  model:
    model_path: /data/lyy/panthera-vla/ci/overfit-ep2-dynamics-24h/ddpfix-dynamics-28d-ep2-24h-20260922T173901Z/paired-preview-step-75000/standard-h20/successful-model-step-75000
    implement_version: official
    model_type: openvla_oft
    precision: bf16
    value_type: ${algorithm.reward_type}
    action_dim: 7
    use_proprio: true
    proprio_dim: 28
    use_film: false
    num_action_chunks: 25
    unnorm_key: panthera_phone_cylinder_socket_v2_dynamics
    center_crop: false
    add_value_head: true
    is_lora: false
    use_l1_regression: true
    max_prompt_length: 512
    num_images_in_input: 1
    continuous_rl: true
    continuous_rl_variant: ${oc.env:PANTHERA_RL_VARIANT,c0}
    execution_horizon: ${oc.decode:${oc.env:PANTHERA_RL_EXECUTION_HORIZON,5}}
    continuous_feature_dim: 256
    continuous_history_dim: 64
    continuous_max_residual: 0.25
    continuous_initial_log_std: -3.0
    continuous_min_log_std: -5.0
    continuous_max_log_std: -1.0
    continuous_consistency_coef: ${oc.decode:${oc.env:PANTHERA_RL_CONSISTENCY_COEF,0.0}}
    continuous_history_noise_std: ${oc.decode:${oc.env:PANTHERA_RL_HISTORY_NOISE_STD,0.0}}
    continuous_history_dropout_probability: ${oc.decode:${oc.env:PANTHERA_RL_HISTORY_DROPOUT,0.0}}
  optim:
    lr: 1.0e-4
    value_lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-8
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
